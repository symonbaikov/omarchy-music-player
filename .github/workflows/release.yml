# When main gets a new version in manifest.json: tag it, publish a GitHub
# release, and ask the Omarchy marketplace to verify that exact commit
# (.github/scripts/marketplace_update.py). Users then see "Update available"
# in the panel; the marketplace listing follows once its maintainer approves.
name: Release

on:
  push:
    branches: [main]
    paths: [manifest.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      created: ${{ steps.release.outputs.created }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Read the version
        id: version
        run: |
          version=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version: $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Tag and publish the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION already released"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
          echo "created=true" >> "$GITHUB_OUTPUT"

  marketplace:
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Ask the marketplace to verify this commit
        env:
          # A classic token of the repository owner with the public_repo
          # scope: it files issues on omacom/omarchy-plugin-marketplace.
          GH_TOKEN: ${{ secrets.MARKETPLACE_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::MARKETPLACE_TOKEN is not set; file the marketplace update by hand."
            exit 0
          fi
          python3 .github/scripts/marketplace_update.py
