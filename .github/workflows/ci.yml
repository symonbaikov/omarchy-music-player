name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install ffmpeg and yt-dlp
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg
          python -m pip install --quiet yt-dlp
      - name: Manifest is valid JSON
        run: python -c "import json; m = json.load(open('manifest.json')); print(m['id'], m['version'])"
      - name: QML model tests
        run: node --test tests/*.test.mjs
      - name: Helper tests
        run: python -I -m unittest discover -s tests -p 'test_*.py'
      - name: Lua script compiles
        run: |
          sudo apt-get install -y -q --no-install-recommends lua5.4
          luac5.4 -p mpv/ytmusic.lua
